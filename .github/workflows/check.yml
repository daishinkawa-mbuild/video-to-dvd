name: DVD処理の基本検証

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-check:
    name: シェルの構文と起動確認
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: macOS標準Bashで構文を確認
        shell: bash
        run: |
          for script in packages/dvd-engine/*.sh; do
            /bin/bash -n "$script"
          done
      - name: 外部ツールを呼び出さずにヘルプを表示
        shell: bash
        run: /bin/bash packages/dvd-engine/dvd-create.sh --help
